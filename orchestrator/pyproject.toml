[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mrn-orchestrator"
version = "0.1.0"
description = "Mortgage Readiness Navigator: the Orchestrator loop and its agents (LangGraph)"
requires-python = ">=3.10"
# Dependencies live in requirements.in (installed with pip install -r requirements.in).

[tool.setuptools.packages.find]
include = ["navigator*"]
